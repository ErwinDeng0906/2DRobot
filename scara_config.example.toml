# 复制本文件为程序根目录下的 scara_config.toml，再按本机修改。
# 启动 main.py 时会自动读取 scara_config.toml（没有则用代码里的默认值）。

[connection]
# SNRobotLab 安装目录：里面要有 snrobot.exe、scara_do.exe、scara_enable.exe、
# RobotSDK.dll、许可证 SiaSunRobot.lic 等。换电脑时主要改这一项。
exe_dir = "D:\\SNRobotLab"
exe_name = "snrobot.exe"

# 下面两项目前主要用于界面显示；真正连控制器时，
# snrobot / scara_do / scara_enable 还会读 SNRobotLab 里的 WorkStationConfig.json，
# 或由 Python 传入 --ip / --port。
controller_ip = "192.168.1.100"
controller_port = 20002

command_timeout_s = 8.0
poll_interval_ms = 300

[motion]
default_speed_percent = 20
default_joint_step_deg = 1.0
default_cart_step_mm = 5.0
move_hold_s = 4

[safety]
require_enable_before_motion = true
disable_on_disconnect = false
allow_t2_mode = false
